name: beauty_platform_dev
services:
  postgres:
    image: postgres:16
    container_name: beauty_platform_postgres
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - beauty_platform_pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: beauty_platform_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
volumes:
  beauty_platform_pgdata:
